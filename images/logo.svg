<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <!-- Solid White Background Layer -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <defs>
    <linearGradient id="rowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
  </defs>

  <!-- Logo Icon -->
  <g transform="translate(20, 25)">
    <rect x="10" y="10" width="80" height="16" rx="8" fill="url(#rowGrad)" />
    <circle cx="22" cy="18" r="4" fill="#FFFFFF" opacity="0.8" />
    
    <rect x="25" y="40" width="85" height="16" rx="8" fill="#4FACFE" />
    <circle cx="37" cy="48" r="4" fill="#FFFFFF" opacity="0.8" />
    
    <rect x="10" y="70" width="80" height="16" rx="8" fill="url(#rowGrad)" />
    <circle cx="22" cy="78" r="4" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Logo Text -->
  <g transform="translate(145, 92)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="64" fill="#1E293B" letter-spacing="-1">Row</text>
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="64" fill="#4FACFE" x="132">DB</text>
  </g>
</svg>